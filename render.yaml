services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: badminton-service-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      # Secrets: set these in the Render dashboard (Environment tab). Never commit them.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # First admin: 10-digit mobile number + password (at least 8 characters)
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Customer login codes by SMS (MSG91 auth key + DLT-approved OTP template id)
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: CORS_ORIGINS
        value: https://badminton-service-platform.onrender.com
      - key: PUBLIC_API_URL
        value: https://badminton-service-backend.onrender.com
      # Login codes are only ever sent by SMS in production. Setting this to "auto" would
      # show codes on screen while SMS isn't set up — anyone could then log in as any customer.
      - key: EXPOSE_OTP_IN_RESPONSE
        value: "false"

  # 2. React Vite Frontend Static Site
  - type: web
    name: badminton-service-platform
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      # Vite build output has content hashes in the file names, so it can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      # index.html (and every SPA route rewritten to it) must be revalidated, or browsers keep
      # running an old build that points at deleted /assets files after a deploy.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), geolocation=(self), microphone=()
      # Google Fonts + the API origin for API calls. Images may come from any https host (the admin can
      # paste image links instead of uploading); request photos are data:/blob: URLs.
      # wa.me / tel: / maps links are plain navigations and aren't restricted by this policy.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://badminton-service-backend.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://badminton-service-backend.onrender.com/api
      - key: VITE_USE_MOCK_API
        value: "false"

services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: badminton-service-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_AygEc1f4VMSb@ep-divine-dawn-b4jpbxy7.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: SECRET_KEY
        generateValue: true

  # 2. React Vite Frontend Static Site
  - type: web
    name: badminton-service-platform
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://badminton-service-backend.onrender.com/api
      - key: VITE_USE_MOCK_API
        value: "false"
